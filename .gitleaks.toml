# Configuração do gitleaks (CI: "Varredura de segredos"). Mantém as regras padrão e só admite os
# **canários sintéticos** dos testes de segurança da Fase 4 (valores inventados que existem justamente
# para provar que um segredo nunca vaza). Nenhuma credencial real entra aqui.
[extend]
useDefault = true

[allowlist]
description = "canários sintéticos e vetores de teste (nunca são credenciais)"
# Vetores de teste de assinatura HMAC dos receptores de webhook de exemplo (Fase 6): segredos inventados,
# usados só para verificar `verify` contra valores calculados de forma independente.
paths = [
  '''examples/webhook-receiver/receiver\.test\.mjs''',
  '''examples/webhook-receiver/test_receiver\.py''',
]
regexes = [
  '''(?i)canary''',
  '''CNRY-[0-9a-z-]+''',
  '''WRNG-[0-9a-z-]+''',
  '''KEY-[a-z0-9-]+-[0-9a-f]{8,}''',
  '''sk-E2E-[A-Za-z0-9-]+''',
]

