# S1 — Preview Surface spike (DESCARTÁVEL). Workspace próprio: fora do build principal e do CI do produto.
# Pergunta (docs/spikes/S1-preview-surface.md): P1 (HWND nativo sob WebView2 transparente) ou P2 (SharedBuffer -> canvas)?
[package]
name = "capia-s1-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29.0.1"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
debug = false
