name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Produto-alvo: Windows. Compila e testa o workspace inteiro, incluindo o shell Tauri, e gera o .exe.
  desktop-windows:
    name: Rust + desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      # FFmpeg explícito e reprodutível (ADR-051): a versão efetiva fica registrada no log do job.
      - name: Instalar FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ffprobe -version | Select-Object -First 1
          ffmpeg -version | Select-Object -First 1
      - run: pnpm install --frozen-lockfile
      # O Tauri embute apps/desktop/dist em tempo de compilação: o front precisa existir antes do cargo.
      - run: pnpm --filter @capia/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Propriedades com IO (SQLite + fsync no NTFS) em orçamento *smoke*: o orçamento completo roda no
      # Linux (release). Os crash tests reais, as migrations e a lógica pura seguem integrais (ADR-051).
      - name: Testes do workspace
        # --no-fail-fast: uma falha não esconde as dos crates seguintes (diagnóstico em uma única rodada)
        run: cargo test --workspace --no-fail-fast
        env:
          CAPIA_REQUIRE_FFMPEG: "1"
          CAPIA_IO_PROP_CASES: "100"
          # pipeline de mídia (FFmpeg real): propriedade em orçamento smoke; crash/cancel/mutação reais seguem
          CAPIA_MEDIA_PROP_CASES: "2"
      - name: Build do aplicativo desktop (sem instalador)
        run: pnpm desktop:build

  # Testes headless rápidos do núcleo (sem dependências de sistema do Tauri) + regra WASM (ADR-016).
  core-linux:
    name: Núcleo Rust (Linux, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # no CI a ausência do FFmpeg FALHA os testes de mídia (localmente eles são ignorados com aviso)
      CAPIA_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Instalar FFmpeg (explícito; versão registrada no log)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          ffmpeg -version | head -1
      - run: cargo fmt --all -- --check
      - name: Clippy do núcleo, jobs, mídia, assets, store, projeto e CLI
        run: cargo clippy -p capia-time -p capia-model -p capia-commands -p capia-jobs -p capia-media -p capia-assets -p capia-store -p capia-project -p capia-cli --all-targets -- -D warnings
      - name: Testes (núcleo, nested/compose, jobs, mídia, assets, migrations, crash, concorrência, CLI)
        run: cargo test -p capia-time -p capia-model -p capia-commands -p capia-jobs -p capia-media -p capia-assets -p capia-store -p capia-project -p capia-cli
      - name: "Propriedades com IO ampliadas (release) — salvar/reabrir e assets"
        run: |
          cargo test --release -p capia-store --test properties -- --nocapture
          cargo test --release -p capia-project --test properties_assets -- --nocapture
        env:
          CAPIA_IO_PROP_CASES: "5000"
      - name: "Pipeline de mídia ampliado (release) — propriedade ponta a ponta com FFmpeg real"
        run: cargo test --release -p capia-project --test properties_media -- --nocapture
        env:
          CAPIA_MEDIA_PROP_CASES: "40"
      - name: Desempenho dos jobs, do hash e do pipeline de mídia (release; medições)
        run: |
          cargo test --release -p capia-jobs --test perf -- --ignored --nocapture
          cargo test --release -p capia-assets --test perf_hash -- --ignored --nocapture
          cargo test --release -p capia-project --test perf_media -- --ignored --nocapture --test-threads=1
      - name: Desempenho da persistência, 10.000 clips (release; sanity check)
        run: cargo test --release -p capia-store --test perf -- --ignored --nocapture
      - name: Desempenho de assets/mídia, 10.000 assets (release; sanity check)
        run: cargo test --release -p capia-project --test perf_assets -- --ignored --nocapture --test-threads=1
      - name: Metas de desempenho do núcleo (release)
        run: cargo test --release -p capia-commands --test perf -- --ignored --nocapture
      - name: Núcleo sem IO compila para WASM (ADR-016)
        run: cargo check --target wasm32-unknown-unknown -p capia-time -p capia-model -p capia-commands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paridade nativo × WASM por digest do documento (ADR-016)
        run: node tools/check-wasm-parity.mjs

  web:
    name: TypeScript (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tools
      - run: pnpm build

  # Política: fronteiras arquiteturais, licenças (docs/PROVENANCE.md) e segredos. Não substitui auditoria humana.
  policy:
    name: Arquitetura, licenças e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fronteiras de arquitetura
        run: pnpm check:arch
      - name: Licenças JS
        run: pnpm check:licenses
      - name: Licenças, bans e fontes Rust (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Avisos de segurança Rust (informativo)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
      - name: Varredura de segredos
        # CLI sobre o histórico completo: o gitleaks-action usa `<primeiro commit do push>^`, inválido
        # quando o push inclui o commit raiz (primeiro push do repositório).
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
