name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Produto-alvo: Windows. Compila e testa o workspace inteiro, incluindo o shell Tauri, e gera o .exe.
  desktop-windows:
    name: Rust + desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      # FFmpeg explícito e reprodutível (ADR-051): a versão efetiva fica registrada no log do job.
      - name: Instalar FFmpeg
        shell: pwsh
        run: ./tools/ci/install-ffmpeg-windows.ps1
      - run: pnpm install --frozen-lockfile
      # Núcleo da timeline em WASM (ADR-070): o front importa o .wasm gerado.
      - run: node tools/build-wasm.mjs
      # O Tauri embute apps/desktop/dist em tempo de compilação: o front precisa existir antes do cargo.
      - run: pnpm --filter @capia/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Propriedades com IO (SQLite + fsync no NTFS) em orçamento *smoke*: o orçamento completo roda no
      # Linux (release). Os crash tests reais, as migrations e a lógica pura seguem integrais (ADR-051).
      - name: Testes do workspace
        # --no-fail-fast: uma falha não esconde as dos crates seguintes (diagnóstico em uma única rodada)
        run: cargo test --workspace --no-fail-fast
        env:
          CAPIA_REQUIRE_FFMPEG: "1"
          CAPIA_IO_PROP_CASES: "100"
          # pipeline de mídia (FFmpeg real): propriedade em orçamento smoke; crash/cancel/mutação reais seguem
          CAPIA_MEDIA_PROP_CASES: "2"
          # render (oráculo × projeto): smoke no Windows; o orçamento pesado roda no Linux (release)
          CAPIA_RENDER_PROP_CASES: "2"
      - name: Detecção de encoders (NVENC/QSV/AMF/Media Foundation/OpenH264; nunca x264/x265)
        shell: pwsh
        run: cargo run -q -p capia-cli -- media encoders
      - name: Aceitação da Fase 2 (CLI ponta a ponta, MP4 + ffprobe) e goldens de render
        run: |
          cargo test -p capia-cli --test phase2_e2e -- --nocapture
          cargo test -p capia-render --test golden_video --test golden_audio
        env:
          CAPIA_REQUIRE_FFMPEG: "1"
      - name: Build do aplicativo desktop (sem instalador)
        run: pnpm desktop:build

  # E2E dos fluxos críticos no APP REAL (WebView2 via CDP, IPC do Tauri, engine e FFmpeg reais),
  # incluindo export MP4 H.264 por encoder aprovado (h264_mf) validado por ffprobe (OUTPUT-H264) e o
  # preview P2 por SharedBuffer. Job próprio: feedback rápido, sem esperar a suíte completa do workspace.
  e2e-windows:
    name: E2E Windows do aplicativo (WebView2, H.264 real, P2)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - name: Instalar FFmpeg
        shell: pwsh
        run: ./tools/ci/install-ffmpeg-windows.ps1
      - run: pnpm install --frozen-lockfile
      - run: node tools/build-wasm.mjs
      - run: pnpm --filter @capia/desktop build
      # Build SÓ para E2E: mesma app, mais a porta CDP do WebView2 (config extra; o produto não a tem)
      - name: Build do aplicativo desktop para E2E (sem instalador)
        run: pnpm --filter @capia/desktop tauri build --no-bundle --config src-tauri/tauri.e2e.conf.json
      - name: E2E do aplicativo (fluxos críticos, H.264 real, SharedBuffer)
        shell: pwsh
        run: pnpm --filter @capia/e2e e2e --workers=1 --grep-invert "targets with 5k clips"
        env:
          CAPIA_E2E_TARGET: tauri
          CAPIA_REQUIRE_H264: "1"
          CAPIA_REQUIRE_SHARED_BUFFER: "1"
          CAPIA_DESKTOP_EXE: ${{ github.workspace }}\target\release\capia-desktop.exe
      - name: Artefatos do E2E Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-results
          path: |
            target/e2e-results
            target/e2e-visual
          if-no-files-found: ignore

  # Testes headless rápidos do núcleo (sem dependências de sistema do Tauri) + regra WASM (ADR-016).
  core-linux:
    name: Núcleo Rust (Linux, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # no CI a ausência do FFmpeg FALHA os testes de mídia (localmente eles são ignorados com aviso)
      CAPIA_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Instalar FFmpeg (explícito; versão registrada no log)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
          ffmpeg -version | head -1
      - run: cargo fmt --all -- --check
      - name: Clippy do núcleo, jobs, mídia, assets, store, projeto e CLI
        run: cargo clippy -p capia-time -p capia-model -p capia-commands -p capia-jobs -p capia-render -p capia-media -p capia-decode -p capia-preview -p capia-assets -p capia-store -p capia-project -p capia-cli --all-targets -- -D warnings
      - name: Testes (núcleo, nested/compose, jobs, mídia, assets, migrations, crash, concorrência, CLI)
        run: cargo test -p capia-time -p capia-model -p capia-commands -p capia-jobs -p capia-render -p capia-media -p capia-decode -p capia-preview -p capia-assets -p capia-store -p capia-project -p capia-cli
      - name: "Propriedades com IO ampliadas (release) — salvar/reabrir e assets"
        run: |
          cargo test --release -p capia-store --test properties -- --nocapture
          cargo test --release -p capia-project --test properties_assets -- --nocapture
        env:
          CAPIA_IO_PROP_CASES: "5000"
      - name: "Pipeline de mídia ampliado (release) — propriedade ponta a ponta com FFmpeg real"
        run: cargo test --release -p capia-project --test properties_media -- --nocapture
        env:
          CAPIA_MEDIA_PROP_CASES: "40"
      - name: "Render ampliado (release) — timelines aleatórias × oráculo de decode direto"
        run: cargo test --release -p capia-project --test properties_render -- --nocapture
        env:
          CAPIA_RENDER_PROP_CASES: "80"
      - name: Desempenho do render, decode e áudio (release; medições)
        run: |
          cargo test --release -p capia-render --test perf -- --ignored --nocapture
          cargo test --release -p capia-decode --test perf -- --ignored --nocapture --test-threads=1
          cargo test --release -p capia-project --test perf_render -- --ignored --nocapture --test-threads=1
      - name: Desempenho dos jobs, do hash e do pipeline de mídia (release; medições)
        run: |
          cargo test --release -p capia-jobs --test perf -- --ignored --nocapture
          cargo test --release -p capia-assets --test perf_hash -- --ignored --nocapture
          cargo test --release -p capia-project --test perf_media -- --ignored --nocapture --test-threads=1
      - name: Desempenho da persistência, 10.000 clips (release; sanity check)
        run: cargo test --release -p capia-store --test perf -- --ignored --nocapture
      - name: Desempenho de assets/mídia, 10.000 assets (release; sanity check)
        run: cargo test --release -p capia-project --test perf_assets -- --ignored --nocapture --test-threads=1
      - name: Metas de desempenho do núcleo (release)
        run: cargo test --release -p capia-commands --test perf -- --ignored --nocapture
      - name: Núcleo sem IO (e o compositor puro) compila para WASM (ADR-016)
        run: cargo check --target wasm32-unknown-unknown -p capia-time -p capia-model -p capia-commands -p capia-render
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paridade nativo × WASM por digest do documento (ADR-016)
        run: node tools/check-wasm-parity.mjs

  web:
    name: TypeScript (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # os testes do ui-timeline carregam o núcleo WASM gerado (ADR-070)
      - run: node tools/build-wasm.mjs
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tools
      - run: pnpm build

  # E2E do editor no navegador contra o engine REAL (capia-devserver + FFmpeg) e metas de UX da timeline
  # com 5.000 clips (smoke: limites folgados; o benchmark estrito é local, GPU real — tools/phase3-acceptance).
  e2e-linux:
    name: E2E do editor + desempenho da timeline (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAPIA_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release -p capia-devserver
      - name: Chromium do Playwright
        run: pnpm --filter @capia/e2e exec playwright install --with-deps chromium
      - name: E2E (17 fluxos, edição, crash, visual)
        run: pnpm --filter @capia/e2e e2e --grep-invert "targets with 5k clips"
      # estabilidade provada, não presumida: o teste que já foi flaky repete 6x (causa raiz: snapshot antes do último commit)
      - name: Estabilidade do undo/redo longo (6 repetições)
        run: pnpm --filter @capia/e2e e2e --workers=1 --repeat-each=6 --grep "undo after a long run"
      # sozinho (1 worker): a medição não pode competir por CPU com outros testes
      - name: Desempenho da timeline (5k clips; smoke, sem competição por CPU)
        run: pnpm --filter @capia/e2e e2e --workers=1 --grep "targets with 5k clips"
      - name: Relatório de desempenho
        if: always()
        run: cat target/perf/phase3-ui-perf.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux-results
          path: |
            target/perf
            target/e2e-results
          if-no-files-found: ignore

  # Política: fronteiras arquiteturais, licenças (docs/PROVENANCE.md) e segredos. Não substitui auditoria humana.
  policy:
    name: Arquitetura, licenças e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fronteiras de arquitetura
        run: pnpm check:arch
      - name: Licenças JS
        run: pnpm check:licenses
      - name: Licenças, bans e fontes Rust (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: Avisos de segurança Rust (informativo)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
      - name: Varredura de segredos
        # CLI sobre o histórico completo: o gitleaks-action usa `<primeiro commit do push>^`, inválido
        # quando o push inclui o commit raiz (primeiro push do repositório).
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
