name: S1 harness (Windows)

# Reproduz o spike S1 (tools/s1-preview-spike) num runner Windows REAL: sem GPU fisica (adaptador
# WARP/software) mas com WebView2, DWM e desktop interativo. Valida o fluxo do usuario
# (Windows PowerShell 5.1 -> run.ps1 -> build -> execucao -> ZIP) e o handshake de layout /
# SharedBuffer / HWND filho. NAO decide OD-1: os numeros de GPU/latencia so valem no PC do usuario.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "tools/s1-preview-spike/**"
      - ".github/workflows/s1-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  s1-windows:
    name: S1 harness (windows-latest, PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/s1-preview-spike
      - name: Autoteste do run.ps1 (Windows PowerShell 5.1)
        shell: powershell
        working-directory: tools/s1-preview-spike
        run: .\selftest.ps1
      - name: Executar run.ps1 (Windows PowerShell 5.1)
        shell: powershell
        working-directory: tools/s1-preview-spike
        run: |
          $PSVersionTable.PSVersion
          .\run.ps1 -Quick -SteadySecs 3
        continue-on-error: true
        id: run
      - name: Executar P2 em 1280x720 (criterio de 720p da regra de decisao)
        shell: powershell
        working-directory: tools/s1-preview-spike
        run: .\run.ps1 -Quick -SteadySecs 10 -Modes p2 -P2Res 1280x720 -Label p2-720p
        continue-on-error: true
        id: run720
      - name: Log do harness e resumo
        if: always()
        shell: powershell
        working-directory: tools/s1-preview-spike
        run: |
          Get-ChildItem reports -ErrorAction SilentlyContinue | Format-Table Name, Length
          foreach ($f in Get-ChildItem reports -Filter "*.md" -ErrorAction SilentlyContinue) { Get-Content $f.FullName }
          foreach ($f in Get-ChildItem reports -Filter "*.events.jsonl" -ErrorAction SilentlyContinue) { Write-Host "=== $($f.Name)"; Get-Content $f.FullName | Select-String -NotMatch '"ui_thread_alive":true' | Select-Object -Last 300 }
          foreach ($f in Get-ChildItem reports -Filter "*.log" -ErrorAction SilentlyContinue) { if ($f.Name -notmatch "build") { Write-Host "=== $($f.Name)"; Get-Content $f.FullName -Tail 200 } }
      - name: Detalhes do relatorio (latencia, sondas, arvore de janelas)
        if: always()
        shell: powershell
        working-directory: tools/s1-preview-spike
        run: |
          foreach ($f in Get-ChildItem reports -Filter "*.harness.json" -ErrorAction SilentlyContinue) {
            $j = Get-Content $f.FullName -Raw | ConvertFrom-Json
            Write-Host "=== runtime.window_tree"; $j.runtime.window_tree.windows | ConvertTo-Json -Depth 4 -Compress
            Write-Host "=== summary"; $j.summary | ConvertTo-Json -Depth 6
            foreach ($m in $j.modes.PSObject.Properties) {
              foreach ($ph in @($m.Value.phases)) {
                if ($ph.name -eq "steady_latency") { Write-Host "=== $($m.Name) steady_latency.screen_latency"; $ph.result.screen_latency | ConvertTo-Json -Depth 5 -Compress }
                if ($ph.name -in @("steady_cpu","resize","fullscreen","input")) { $t = ($ph.result | ConvertTo-Json -Depth 6 -Compress); if ($t.Length -gt 2500) { $t = $t.Substring(0,2500) }; Write-Host "=== $($m.Name) $($ph.name)"; $t }
                if ($ph.name -eq "probe_static") { Write-Host "=== $($m.Name) probe_static"; $ph.result | ConvertTo-Json -Depth 6 -Compress }
              }
              Write-Host "=== $($m.Name) engine_stats"; $m.Value.engine_stats_whole_mode | ConvertTo-Json -Depth 4 -Compress
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-report
          path: tools/s1-preview-spike/reports/*.zip
          if-no-files-found: warn
      - name: Falhar se o run.ps1 falhou
        if: steps.run.outcome != 'success' || steps.run720.outcome != 'success'
        shell: powershell
        run: exit 1
