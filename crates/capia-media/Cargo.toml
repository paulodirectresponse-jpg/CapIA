[package]
name = "capia-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Probe e normalização de mídia (ffprobe atrás de um trait) — ADR-047"

[lints]
workspace = true

[dependencies]
capia-time.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[features]
# Injeção de falhas (park/abort em pontos de jobs de mídia) — SÓ para testes de crash.
failpoints = []

[dev-dependencies]
capia-media = { path = ".", features = ["failpoints"] }
