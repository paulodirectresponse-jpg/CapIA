[package]
name = "capia-intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Fase 4: inteligência assistida — transcrição, legendas automáticas, silêncio, cenas, Reference Analyzer, Demand Interpreter, assistente com tools (ADR-079..084)"

[lints]
workspace = true

[dependencies]
capia-time.workspace = true
capia-model.workspace = true
capia-commands.workspace = true
capia-media.workspace = true
capia-assets.workspace = true
capia-store.workspace = true
capia-project.workspace = true
capia-editor-api.workspace = true
capia-ai.workspace = true
capia-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"
base64 = "0.22"
async-trait = "0.1"

[features]
# pontos de falha para testes de crash/resume da autonomia — SÓ testes
failpoints = []
# geradores de DOCX/PDF para testes de integração (sem binários versionados)
testkit = []

[dev-dependencies]
capia-ai = { workspace = true, features = ["testkit"] }
capia-intelligence = { path = ".", features = ["testkit", "failpoints"] }
