[package]
name = "capia-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Injeção de falhas nos jobs de mídia (park/abort em pontos do índice/waveform/proxy) — SÓ testes.
failpoints = ["capia-media/failpoints"]

[dependencies]
capia-time.workspace = true
capia-model.workspace = true
capia-commands.workspace = true
capia-store.workspace = true
capia-assets.workspace = true
capia-media.workspace = true
capia-jobs.workspace = true
capia-decode.workspace = true
capia-render.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# habilita `failpoints` nos testes de crash sem expor a feature no build normal
capia-project = { path = ".", features = ["failpoints"] }
