[package]
name = "capia-timeline-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Funções puras de UX da timeline (snap, movimento de grupo, colocação) do core compiladas para WASM: a UI calcula o ghost com a MESMA matemática do engine (ADR-070). Única crate com unsafe (borda FFI mínima)."

[lib]
crate-type = ["cdylib", "rlib"]

# Esta crate NÃO herda os lints do workspace: precisa de `unsafe` para exportar a ABI C do WASM
# (ver ADR-070). O resto da política (unwrap etc.) é replicado abaixo.
[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dependencies]
capia-time.workspace = true
capia-model.workspace = true
capia-commands.workspace = true
serde.workspace = true
serde_json.workspace = true
