<!doctype html><meta charset="utf-8"><title>S5 timeline probe</title>
<style>body{margin:0;background:#111;color:#ccc;font:11px sans-serif}#c{display:block}#dom{position:relative;overflow:hidden;width:1920px;height:500px;background:#181818}
#wrap{position:absolute;left:0;top:0;will-change:transform}.k{position:absolute;box-sizing:border-box;border:1px solid #6aa;background:#235;overflow:hidden;white-space:nowrap;font-size:10px;color:#cde;padding:2px}</style>
<canvas id="c" width="1920" height="500"></canvas><div id="dom" style="display:none"></div>
<script>
// ---- synthetic dataset: 50 tracks x 200 clips = 10_000 clips (seconds only for the probe; real model uses Ticks) ----
const TRACKS=50, PER=200; let seed=12345; const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
const tracks=[]; let total=0;
for(let t=0;t<TRACKS;t++){const arr=[];let c=rnd()*5;for(let i=0;i<PER;i++){const d=0.5+rnd()*7.5;arr.push({s:c,d,w:rnd()<0.3,n:'clip '+t+'-'+i});c+=d+rnd()*2}tracks.push(arr);total=Math.max(total,c)}
const W=1920,H=500; const ctx=document.getElementById('c').getContext('2d',{alpha:false});
const S={pps:20,scrollX:0,scrollY:0,rowH:48,drag:null};
function lowerBound(a,x){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m].s+a[m].d<x)lo=m+1;else hi=m}return lo}
let drawn=0;
function drawCanvas(){
  drawn=0; ctx.fillStyle='#181818';ctx.fillRect(0,0,W,H);
  const t0=S.scrollX/S.pps,t1=(S.scrollX+W)/S.pps; const r0=Math.max(0,Math.floor(S.scrollY/S.rowH)),r1=Math.min(TRACKS-1,Math.ceil((S.scrollY+H)/S.rowH));
  const rh=S.rowH-4; ctx.font='10px sans-serif'; ctx.textBaseline='top';
  for(let r=r0;r<=r1;r++){const arr=tracks[r],y=r*S.rowH-S.scrollY;
    for(let i=lowerBound(arr,t0);i<arr.length;i++){const c=arr[i]; if(c.s>t1)break;
      let x=c.s*S.pps-S.scrollX,w=c.d*S.pps; if(S.drag&&S.drag.c===c)x+=S.drag.dx; drawn++;
      ctx.fillStyle=c.w?'#1d4a3a':'#234a6a'; ctx.fillRect(x,y,Math.max(w,1),rh);
      if(w>=6){ctx.strokeStyle='#8cd';ctx.strokeRect(x+.5,y+.5,w-1,rh-1)}
      if(w>=40){ctx.save();ctx.beginPath();ctx.rect(x,y,w,rh);ctx.clip();ctx.fillStyle='#dff';ctx.fillText(c.n,x+3,y+3);
        if(c.w){ctx.strokeStyle='#7fd';ctx.beginPath();const n=Math.min(200,Math.floor(w/2));for(let k=0;k<n;k++){const px=x+k*(w/n),a=(Math.sin(k*1.7+i)*0.5+0.5)*rh*0.4;ctx.moveTo(px,y+rh*.65-a);ctx.lineTo(px,y+rh*.65+a)}ctx.stroke()}
        ctx.restore()}
    }}
  // ruler + playhead
  ctx.fillStyle='#fff';ctx.fillRect((W/2),0,1,H);
}
// ---- DOM renderer: ALL clips as absolutely-positioned divs (what unvirtualized DOM timelines do) ----
let domBuilt=false, domEls=[];
function buildDom(){const wrap=document.createElement('div');wrap.id='wrap';document.getElementById('dom').appendChild(wrap);
  for(let t=0;t<TRACKS;t++)for(const c of tracks[t]){const e=document.createElement('div');e.className='k';e.textContent=c.n;e.style.top=(t*S.rowH)+'px';e.style.height=(S.rowH-4)+'px';wrap.appendChild(e);domEls.push([e,c])}
  domBuilt=true; return wrap}
function drawDom(mode){const wrap=document.getElementById('wrap');
  if(mode==='zoom'||mode==='drag'||mode==='fit'){for(const [e,c] of domEls){e.style.left=(c.s*S.pps)+'px';e.style.width=(c.d*S.pps)+'px'}}
  wrap.style.transform=`translate(${-S.scrollX}px,${-S.scrollY}px)`;
  if(mode==='drag'){const [e,c]=domEls[5000];e.style.left=(c.s*S.pps+S.drag.dx)+'px'}
  // force layout+paint cost to be attributed to this frame
  wrap.getBoundingClientRect(); }
window.runScenario=async function(renderer,scenario,frames){
  const isDom=renderer==='dom'; document.getElementById('c').style.display=isDom?'none':'block'; document.getElementById('dom').style.display=isDom?'block':'none';
  if(isDom&&!domBuilt){const t=performance.now();buildDom();window.__domBuildMs=performance.now()-t}
  S.pps=20;S.scrollX=0;S.scrollY=0;S.rowH=48;S.drag=null; const times=[],cpu=[]; let last=performance.now();
  const midClip=tracks[5][100]; // in canvas mode drag this one
  for(let f=0;f<frames;f++){
    const p=f/frames;
    if(scenario==='scroll'){S.scrollX=p*(total*S.pps-W)}
    if(scenario==='zoom'){S.pps=2*Math.pow(200,0.5+0.5*Math.sin(p*Math.PI*4-Math.PI/2)); S.scrollX=Math.max(0,total*S.pps*0.3)}
    if(scenario==='drag'){S.pps=20;S.scrollX=midClip.s*S.pps-W/2;S.drag={c:midClip,dx:Math.sin(p*20)*150}}
    if(scenario==='fit'){S.pps=W/total;S.scrollX=0;S.rowH=10}   // ALL 10_000 clips visible at once (worst case)
    const a=performance.now(); if(isDom)drawDom(scenario);else drawCanvas(); cpu.push(performance.now()-a);
    await new Promise(r=>requestAnimationFrame(()=>{const n=performance.now();times.push(n-last);last=n;r()}));
  }
  const q=(arr,x)=>{const s=[...arr].sort((a,b)=>a-b);return +s[Math.floor(x*(s.length-1))].toFixed(2)};
  return {renderer,scenario,frames,visible_clips_drawn:isDom?10000:drawn,frame_ms_p50:q(times.slice(3),.5),frame_ms_p95:q(times.slice(3),.95),frame_ms_max:q(times.slice(3),1),js_draw_ms_p50:q(cpu,.5),js_draw_ms_p95:q(cpu,.95),dom_build_ms:isDom?+(window.__domBuildMs||0).toFixed(0):undefined,total_seconds:+total.toFixed(0)};
}
</script>
